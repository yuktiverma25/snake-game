<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <h1>Fun Quiz App</h1>
        <div id="quiz">
            <div id="question-container">
                <div id="question">Question text will appear here</div>
                <div id="options">
                    <button class="option-btn" id="option1"></button>
                    <button class="option-btn" id="option2"></button>
                    <button class="option-btn" id="option3"></button>
                    <button class="option-btn" id="option4"></button>
                </div>
            </div>
            <div id="navigation">
                <button id="prev-btn">Previous</button>
                <button id="next-btn">Next</button>
                <button id="submit-btn">Submit</button>
            </div>
        </div>
        <div id="result-container" class="hide">
            <h2>Your Score: <span id="score"></span> / <span id="total"></span></h2>
            <button id="restart-btn">Restart Quiz</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
